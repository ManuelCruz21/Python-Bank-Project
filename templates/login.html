<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyBank - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-3xl font-bold tracking-wide">🏦 PyBank</h1>
            <p class="text-blue-100 text-sm mt-1">Authentication Portal</p>
        </div>

        <div class="p-6 pb-0">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="p-3 rounded-lg text-sm text-white {% if category == 'error' %}bg-red-500{% else %}bg-green-500{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <div class="p-6 space-y-6">
            
            <!-- LOGIN FORM -->
            <form action="/login" method="POST" class="space-y-4">
                <h2 class="text-xl font-bold text-gray-800">Access My Account</h2>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">Account Number</label>
                    <input type="text" name="numero" required placeholder="ex: 1010" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">Access PIN Code</label>
                    <input type="password" name="pin" required placeholder="••••" maxlength="4" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg text-sm tracking-widest focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow-md transition">
                    Log In to System →
                </button>
            </form>

            <hr class="border-gray-200">

            <!-- REGISTRATION FORM -->
            <form action="/criar-conta" method="POST" class="space-y-4">
                <h2 class="text-xl font-bold text-gray-800">Don't have an account? Register</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase">Desired Acc Number</label>
                        <input type="text" name="numero" required placeholder="ex: 123" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase">Set PIN Code (4 digits)</label>
                        <input type="password" name="pin" required placeholder="ex: 1234" maxlength="4" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg text-sm tracking-widest focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">Account Holder Full Name</label>
                    <input type="text" name="titular" required placeholder="ex: Tomás Quintas" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow-md transition">
                    Create and Activate Account
                </button>
            </form>

        </div>
    </div>

</body>
</html>
